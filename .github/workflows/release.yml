name: Manual Multi-Platform Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag override (optional, e.g. v1.2.0, defaults to Cargo.toml version)'
        required: false
        default: ''

jobs:
  build-macos:
    name: Build Universal macOS DMG (Intel + Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & Universal Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Run Test Suite
        run: cargo test

      - name: Build for Intel (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for Apple Silicon (aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal 2 Binary (Intel + Apple Silicon)
        run: |
          mkdir -p target/universal
          lipo -create -output target/universal/eigengraph \
            target/x86_64-apple-darwin/release/eigengraph \
            target/aarch64-apple-darwin/release/eigengraph
          file target/universal/eigengraph

      - name: Package macOS App Bundle & DMG
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          mkdir -p "EigenGraph.app/Contents/MacOS"
          mkdir -p "EigenGraph.app/Contents/Resources/InternalVault/Demo/NVW_DCR-LOD"
          mkdir -p "EigenGraph.app/Contents/Resources/InternalVault/Projects"
          mkdir -p "EigenGraph.app/Contents/Resources/InternalVault/ParametricLibrary"
          mkdir -p "EigenGraph.app/Contents/Resources/InternalVault/KnowledgeBase"
          mkdir -p "EigenGraph.app/Contents/Resources/InternalVault/Exports"
          if [ -d "InternalVault" ]; then
            cp -R InternalVault/* "EigenGraph.app/Contents/Resources/InternalVault/" 2>/dev/null || true
          fi

          cp target/universal/eigengraph "EigenGraph.app/Contents/MacOS/"
          chmod +x "EigenGraph.app/Contents/MacOS/eigengraph"

          if [ -f "assets/Info.plist" ]; then
            cp assets/Info.plist "EigenGraph.app/Contents/"
            sed -i '' "s/<string>1.0.0<\/string>/<string>${VERSION}<\/string>/g" "EigenGraph.app/Contents/Info.plist" || true
            sed -i '' "s/<string>1.2.0<\/string>/<string>${VERSION}<\/string>/g" "EigenGraph.app/Contents/Info.plist" || true
          fi
          if [ -f "assets/AppIcon.icns" ]; then
            cp assets/AppIcon.icns "EigenGraph.app/Contents/Resources/"
          elif [ -f "assets/icon.png" ]; then
            cp assets/icon.png "EigenGraph.app/Contents/Resources/"
          fi

          codesign --force --deep --sign - "EigenGraph.app"

          mkdir -p dmg_staging
          cp -R "EigenGraph.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications

          hdiutil create -volname "EigenGraph" -srcfolder "dmg_staging" -ov -format UDZO "EigenGraph-macOS.dmg"
          rm -rf dmg_staging EigenGraph.app

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EigenGraph-macOS-DMG
          path: EigenGraph-macOS.dmg

  build-windows:
    name: Build Windows Release (.zip)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Test Suite
        run: cargo test

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          $VERSION = (Select-String -Path Cargo.toml -Pattern '^version = "(.*?)"').Matches.Groups[1].Value
          $stage = "staging/EigenGraph-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$stage/assets" | Out-Null
          Copy-Item target/release/eigengraph.exe -Destination $stage/
          if (Test-Path "assets/icon.png") {
            Copy-Item "assets/icon.png" -Destination "$stage/assets/"
          }
          if (Test-Path "assets/Info.plist") {
            Copy-Item "assets/Info.plist" -Destination "$stage/assets/"
          }
          if (Test-Path "InternalVault") {
            Copy-Item -Recurse InternalVault -Destination $stage/
          }
          Set-Content -Path "$stage/README.txt" -Value @(
            "============================================================",
            " EigenGraph — High-Performance 10D BIM & Structural Analytics",
            " Platform: Windows x64 (Windows 10 / Windows 11)",
            " Version:  v$VERSION",
            "============================================================",
            "",
            "Quick Start Instructions:",
            "1. Extract all contents of this ZIP archive to your preferred directory.",
            "2. Double-click 'eigengraph.exe' to launch the desktop workstation.",
            "3. The parametric component database and InternalVault synchronize",
            "   automatically in real time.",
            "",
            "Documentation & Releases: https://github.com/EigenGraph/EigenGraph"
          ) -Encoding utf8

          Compress-Archive -Path "$stage/*" -DestinationPath "EigenGraph-Windows-x64.zip" -Force

      - name: Upload Windows Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EigenGraph-Windows-x64
          path: EigenGraph-Windows-x64.zip

  build-linux:
    name: Build Linux Release (.tar.gz)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Linux Swap Memory
        run: |
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Linux GUI & EGL Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config build-essential clang libclang-dev llvm-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libwayland-dev libwayland-cursor0 libwayland-egl1 libwayland-server0 \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev \
            libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libssl-dev libgtk-3-dev libasound2-dev libudev-dev \
            libfontconfig1-dev libfreetype6-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Test Suite
        run: cargo test

      - name: Build Release Binary
        shell: bash
        run: |
          cargo build --release --bin eigengraph --verbose 2>&1 | tee cargo_build.log || {
            echo "### ❌ Linux Cargo Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 cargo_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Package Linux Tarball & Desktop Entry
        shell: bash
        run: |
          STAGE_DIR="staging/EigenGraph-Linux-x86_64"
          mkdir -p "${STAGE_DIR}/assets"
          cp target/release/eigengraph "${STAGE_DIR}/"
          chmod +x "${STAGE_DIR}/eigengraph"
          if [ -f "assets/icon.png" ]; then
            cp "assets/icon.png" "${STAGE_DIR}/assets/"
          fi
          if [ -f "assets/Info.plist" ]; then
            cp "assets/Info.plist" "${STAGE_DIR}/assets/"
          fi
          if [ -d "InternalVault" ]; then
            cp -r InternalVault "${STAGE_DIR}/"
          fi

          printf '[Desktop Entry]\nName=EigenGraph\nComment=High-Performance 10D BIM & Structural Analytics\nExec=eigengraph\nIcon=eigengraph\nTerminal=false\nType=Application\nCategories=Development;Engineering;Science;\n' > "${STAGE_DIR}/eigengraph.desktop"

          {
            echo '#!/usr/bin/env bash'
            echo 'set -e'
            echo 'INSTALL_BIN="${HOME}/.local/bin"'
            echo 'DESKTOP_DIR="${HOME}/.local/share/applications"'
            echo 'ICON_DIR="${HOME}/.local/share/icons/hicolor/256x256/apps"'
            echo 'mkdir -p "$INSTALL_BIN" "$DESKTOP_DIR" "$ICON_DIR"'
            echo 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"'
            echo 'cp "$SCRIPT_DIR/eigengraph" "$INSTALL_BIN/"'
            echo 'chmod +x "$INSTALL_BIN/eigengraph"'
            echo 'if [ -f "$SCRIPT_DIR/assets/icon.png" ]; then'
            echo '  cp "$SCRIPT_DIR/assets/icon.png" "$ICON_DIR/eigengraph.png"'
            echo 'fi'
            echo 'sed "s|Exec=eigengraph|Exec=$INSTALL_BIN/eigengraph|g" "$SCRIPT_DIR/eigengraph.desktop" > "$DESKTOP_DIR/eigengraph.desktop"'
            echo 'sed -i "s|Icon=eigengraph|Icon=$ICON_DIR/eigengraph.png|g" "$DESKTOP_DIR/eigengraph.desktop"'
            echo 'echo "✅ EigenGraph installed successfully to $INSTALL_BIN/eigengraph"'
          } > "${STAGE_DIR}/install.sh"
          chmod +x "${STAGE_DIR}/install.sh"

          tar -czvf "EigenGraph-Linux-x86_64.tar.gz" -C staging EigenGraph-Linux-x86_64

      - name: Upload Linux Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EigenGraph-Linux-x86_64
          path: EigenGraph-Linux-x86_64.tar.gz

  publish-release:
    name: Publish Multi-Platform Release to GitHub
    needs: [build-macos, build-windows, build-linux]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS DMG Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: EigenGraph-macOS-DMG
          path: dist

      - name: Download Windows Archive Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: EigenGraph-Windows-x64
          path: dist

      - name: Download Linux Tarball Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: EigenGraph-Linux-x86_64
          path: dist

      - name: Generate Checksums & Multi-Platform Release Notes
        shell: bash
        run: |
          mkdir -p dist
          cd dist
          find . -mindepth 2 -type f -exec mv -t . {} + 2>/dev/null || true
          sha256sum EigenGraph-* > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true
          cd ..

          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          USER_TAG="${{ github.event.inputs.tag_name }}"
          TAG_NAME="${USER_TAG:-v${VERSION}}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          python3 -c '
          import os
          version = os.environ.get("VERSION", "0.1.0")
          tag = os.environ.get("TAG_NAME", "v0.1.0")

          with open("dist/SHA256SUMS.txt", "r") as f:
              checksums = f.read().strip()

          notes = f"""### 🚀 EigenGraph {tag} — Universal Multi-Platform Release (macOS, Windows & Linux)

          Official desktop workstation release of **EigenGraph** for **macOS (Universal 2: Apple Silicon & Intel)**, **Windows 10/11 (64-bit)**, and **Linux (x86_64)**.

          ---

          #### 📦 Official Multi-Platform Release Packages

          | Operating System / Platform | Release Asset | Installation Instructions |
          | :--- | :--- | :--- |
          | 🍎 **macOS (Universal 2)** | [`EigenGraph-macOS.dmg`](https://github.com/EigenGraph/EigenGraph/releases/download/{tag}/EigenGraph-macOS.dmg) | Native **Apple Silicon (M1/M2/M3/M4)** & **Intel x86_64** (macOS 11+). Open the DMG disk image and drag `EigenGraph.app` to `/Applications`. |
          | 🪟 **Windows (64-bit)** | [`EigenGraph-Windows-x64.zip`](https://github.com/EigenGraph/EigenGraph/releases/download/{tag}/EigenGraph-Windows-x64.zip) | Native **Windows 10 & Windows 11 (x64)**. Extract the ZIP archive and run `eigengraph.exe`. |
          | 🐧 **Linux (x86_64)** | [`EigenGraph-Linux-x86_64.tar.gz`](https://github.com/EigenGraph/EigenGraph/releases/download/{tag}/EigenGraph-Linux-x86_64.tar.gz) | Native **Ubuntu 20.04+, Debian, Fedora, Arch (x86_64)**. Extract the tarball and run `./install.sh` or `./eigengraph`. |
          | 🔐 **SHA-256 Checksums** | [`SHA256SUMS.txt`](https://github.com/EigenGraph/EigenGraph/releases/download/{tag}/SHA256SUMS.txt) | NIST FIPS 180-4 SHA-256 integrity manifest for all release archives. |

          ---

          #### 🌟 Key Architectural & Engineering Highlights
          - **🖥️ Native macOS HIG Dark UI & Responsive Multi-Row Toolbars**: Full-height unified 13-pillar sidebar (`🔍 Search`), live ARI/SVD header telemetry badges, wrapped 8D verification sub-tab pill bar, and compact 3D Model Archetype selector with zero horizontal clipping.
          - **📐 2D Sheet Composer & Blueprints**: Scaled engineering drawing sheets (A4, A3, A2, A1) with multi-viewport Floor Plan, Section Cut (Poché), BoQ Schedule, and ISO 7200 Title Block exported to **Vector PDF 1.4**, **SVG**, and **IFC4**.
          - **⚡ Geometric Stiffness $K_g(P)$ & Linear ARI Screening**: Sherman-Morrison $O(N^2)$ rank-1 and Woodbury rank-2 ($N-2$) disruption screening with SVD Kinematic Mechanism Guard ($m_e = 1 - h_e$) and Euler/AISC 360-16 $B_1$ stability verification.
          - **🗄️ Obsidian Auto-Taxonomy Internal Vault**: Zero-click reactive autosave integrated with the Floating Dynamic Island AI Copilot (`⌘K`).

          ---

          #### 🔐 SHA-256 Cryptographic Checksums
          ```text
          {checksums}
          ```
          """
          with open("dist/RELEASE_NOTES.md", "w") as f:
              f.write(notes.strip())
          '

      - name: Publish to GitHub Releases & Sync to assets/ Directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists. Uploading all platform assets..."
            gh release upload "${TAG_NAME}" dist/EigenGraph-* dist/SHA256SUMS.txt --clobber
            gh release edit "${TAG_NAME}" --notes-file dist/RELEASE_NOTES.md
          else
            echo "Creating new multi-platform GitHub Release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" dist/EigenGraph-* dist/SHA256SUMS.txt \
              --title "EigenGraph ${TAG_NAME} — Multi-Platform (macOS, Windows & Linux)" \
              --notes-file dist/RELEASE_NOTES.md
          fi

          mkdir -p assets
          cp -f dist/EigenGraph-* dist/SHA256SUMS.txt assets/ || true
          git config user.name "Harids Irawan"
          git config user.email "326791992+haridsirawan@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp -f dist/EigenGraph-* dist/SHA256SUMS.txt assets/ || true
          git add -f assets/EigenGraph-* assets/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): store macOS .dmg, Windows .zip & Linux .tar.gz release binaries in assets/ (${TAG_NAME}) [skip ci]"
            git push origin main || true
          fi


