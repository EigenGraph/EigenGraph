name: Build & Deploy EigenGraph Web App (Cloudflare Workers)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-workers-deploy"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust Unit Tests & WASM Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & wasm32 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux System Libraries for Native Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config build-essential libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libwayland-dev libgtk-3-dev libfontconfig1-dev libfreetype6-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v1-

      - name: Run Unit Test Suite
        run: cargo test --lib

      - name: Verify WebAssembly Compilation
        run: cargo check --bin eigengraph --target wasm32-unknown-unknown

  build-and-deploy:
    name: Build Trunk WASM & Deploy to Cloudflare Workers
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & wasm32 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-wasm-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-v1-

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1

      - name: Build EigenGraph WebAssembly App
        run: trunk build --release --public-url /

      - name: Deploy Static Assets to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d53f20ace71a15665f813fedb55fde1c
          wranglerVersion: "4.160.0"
          command: deploy
