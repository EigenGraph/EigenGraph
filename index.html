<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EigenGraph — 10D BIM &amp; Structural Analytics</title>
  <meta name="description" content="EigenGraph 10D BIM, Adjusted Redundancy Index (ARI), SVD Kinematic Mechanism Guards, and Structural Graph Analytics Workstation running natively in WebAssembly." />

  <link data-trunk rel="icon" href="assets/icon.png" />
  <link data-trunk rel="copy-file" href=".nojekyll" />
  <link data-trunk rel="rust" data-bin="eigengraph" data-wasm-opt="0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f1117;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    canvas#eigengraph_canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }

    #loading_overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #16223a 0%, #0f1117 70%);
      z-index: 9999;
      gap: 16px;
      text-align: center;
      padding: 24px;
    }

    .eg-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(45, 140, 255, 0.2);
      border-top-color: #2d8cff;
      border-radius: 50%;
      animation: eg-spin 0.9s linear infinite;
    }

    @keyframes eg-spin {
      to { transform: rotate(360deg); }
    }

    .eg-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .eg-subtitle {
      font-size: 13px;
      color: #a5b4ca;
      margin: 0;
    }
  </style>
</head>
<body>
  <canvas id="eigengraph_canvas"></canvas>

  <div id="loading_overlay">
    <div class="eg-spinner"></div>
    <h1 class="eg-title">EigenGraph Workstation</h1>
    <p class="eg-subtitle">Loading 10D BIM &amp; Structural Analytics WebAssembly Engine...</p>
  </div>
</body>
</html>
