[package]
name = "eigengraph"
version = "0.2.5"
edition = "2021"
default-run = "eigengraph"
authors = ["Harids Irawan <harids.irawan@gmail.com>"]
description = "EigenGraph — 10D BIM & Structural Graph Analytics (WebAssembly Web App)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EigenGraph/EigenGraph"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Url",
    "Window",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lib]
name = "eigengraph"
path = "src/lib.rs"

[[bin]]
name = "eigengraph"
path = "src/main.rs"

[[bin]]
name = "make_icon"
path = "src/bin/make_icon.rs"
